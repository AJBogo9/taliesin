<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Taliesin">
  <!-- Which palette paints is the reader's DEVICE and nothing else (render/theme.rs), and a
       tab icon sits outside the document, so it asks the device directly. The two fills below
       are the light palette AND the fallback for any renderer that ignores the stylesheet;
       the rule swaps in tokens-dark.css's ground and ink, and nothing else (spec §7). -->
  <style>
    @media (prefers-color-scheme: dark) {
      .ground { fill: #14130F }
      .ink { fill: #EAE7E0 }
    }
  </style>
  <rect class="ground" width="64" height="64" fill="#FBF9F5"/>
  <path class="ink" d="M14 16h36v7H36.5v32h-9V23H14z" fill="#22201A"/>
</svg>
