[package]
name = "taliesin-core"
description = "Parser, block model, and HTML rendering for Taliesin"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
comrak = "0.52.0"
katex = "0.4.6"
serde = { workspace = true }
serde_yaml = { workspace = true }
syntect = { workspace = true }
# Already in the tree (transitively via comrak); used directly for NFC composition
# of LaTeX accent macros in BibTeX fields (cite.rs). No new download.
unicode-normalization = "0.1"

[dev-dependencies]
serde_json = "1"
