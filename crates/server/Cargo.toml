[package]
name = "taliesin-server"
description = "Long-running dev server: websocket protocol, file watcher, kernel pool"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "taliesin"
path = "src/main.rs"

# `read --run`'s `{js}` observation is the ONLY thing that needs a browser driver, and it
# needs a system Chrome at runtime on top of that. Measured on a clean release build
# (2026-07-28, `-j3`): `chromiumoxide` + `chromiumoxide_cdp` are the two most expensive
# units in the entire 344-unit graph, and the crates reachable only through them cost
# **81 of 336 CPU-seconds — 24% of the build** — for a feature most users never invoke.
# So it is off by default and the released binaries turn it on (`release.yml`). Without it
# `read --run-js` still answers; every `{js}` cell reports `skipped` with a reason naming
# the rebuild, which is the same degradation path a missing Chrome already takes.
[features]
default = []
headless-js = ["dep:chromiumoxide"]

# All four need the driver to compile at all, so Cargo skips them unless the feature is on.
# `tools/gates.sh` passes `--features headless-js` and then asserts these tests
# printed `... ok` BY NAME, so silently dropping the feature turns the gate red.
[[test]]
name = "read_run_js"
required-features = ["headless-js"]

[[test]]
name = "print_pdf"
required-features = ["headless-js"]

[[test]]
name = "deck_browser"
required-features = ["headless-js"]

[[test]]
name = "reactive_browser"
required-features = ["headless-js"]

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
dialoguer = { workspace = true }
futures-util = "0.3.32"
jupyter-protocol = "2.0.1"
jupyter-zmq-client = { version = "1.0.0", features = ["tokio-runtime"] }
libc = { workspace = true }
notify = "8.2.0"
parking_lot = { workspace = true }
taliesin-core = { workspace = true }
# The build's AVIF transcode (item 169). Core already depends on `image` for header-only
# dimension reads; the two extra features are the encoder and the parallelism to run it
# across a page's images, since one 1200x630 encode is ~0.9 s. Feature unification means the
# workspace compiles `image` once with the union.
image = { workspace = true, features = ["avif", "rayon"] }
rayon = "1"
# Cache keys for image derivatives, keyed on source BYTES. Already a workspace dep.
sha2 = { workspace = true }
# terminal QR rendering only; default features pull in image/svg backends we don't need
qrcode = { version = "0.14", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
terminal_size = "0.4.4"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
uuid = { version = "1.23.3", features = ["v4"] }
lsp-server = "0.7"
lsp-types = "0.95"

# Headless-Chrome driver for `read --run`'s `{js}` observation (DX17b): CDP over a
# local, system-provided Chrome so a `{js}`/Observable-Plot cell can be checked for
# "did it actually produce an <svg>/<canvas>". `default-features = false` drops the
# `bytes` screenshot API we don't use and, crucially, the `fetcher`/`native-tls`/
# `rustls` browser-download stack — this tool stays offline and never fetches a
# browser (reqwest is pulled with no TLS backend, for the loopback CDP handshake
# only). Gated twice over: `optional` keeps it out of a default build entirely (see
# `[features]`), and at runtime no system Chrome → "skipped", never a hard failure.
# Uses tokio (the workspace runtime); `futures` drives its CDP Handler.
chromiumoxide = { version = "0.9", default-features = false, optional = true }
futures = "0.3"
