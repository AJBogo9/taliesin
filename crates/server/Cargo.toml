[package]
name = "qmd-fast-server"
description = "Long-running dev server: websocket protocol, file watcher, kernel pool"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "qmd-fast"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.32"
jupyter-protocol = "2.0.1"
jupyter-zmq-client = { version = "1.0.0", features = ["tokio-runtime"] }
libc = { workspace = true }
notify = "8.2.0"
parking_lot = { workspace = true }
qmd-fast-core = { workspace = true }
# terminal QR rendering only; default features pull in image/svg backends we don't need
qrcode = { version = "0.14", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
terminal_size = "0.4.4"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
uuid = { version = "1.23.3", features = ["v4"] }
