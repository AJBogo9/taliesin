[package]
name = "taliesin-server"
description = "Long-running dev server: websocket protocol, file watcher, kernel pool"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "taliesin"
path = "src/main.rs"

# The two browser-backed TEST binaries are all that needs a browser driver now — the
# `pdf` verb that used to drive it was cut on 2026-08-08 — and they need a system Chrome
# at runtime on top of that. Measured on a clean release build (2026-07-28, `-j3`):
# `chromiumoxide` + `chromiumoxide_cdp` are the two most expensive units in the entire
# 344-unit graph, and the crates reachable only through them cost **81 of 336
# CPU-seconds — 24% of the build**. So it is off by default; `tools/gates.sh` and CI turn
# it on, which is the only place it is needed.
[features]
default = []
headless-js = ["dep:chromiumoxide"]

# Both need the driver to compile at all, so Cargo skips them unless the feature is on.
# `tools/gates.sh` passes `--features headless-js` and then asserts these tests
# printed `... ok` BY NAME, so silently dropping the feature turns the gate red.
[[test]]
name = "deck_browser"
required-features = ["headless-js"]

[[test]]
name = "reactive_browser"
required-features = ["headless-js"]

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
dialoguer = { workspace = true }
futures-util = "0.3.32"
jupyter-protocol = "2.0.1"
jupyter-zmq-client = { version = "1.0.0", features = ["tokio-runtime"] }
libc = { workspace = true }
notify = "8.2.0"
parking_lot = { workspace = true }
taliesin-core = { workspace = true }
# The session-key digest (`session.rs`). Already a workspace dep.
sha2 = { workspace = true }
# terminal QR rendering only; default features pull in image/svg backends we don't need
qrcode = { version = "0.14", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
terminal_size = "0.4.4"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
uuid = { version = "1.23.3", features = ["v4"] }
lsp-server = "0.7"
lsp-types = "0.95"

# Headless-Chrome driver: CDP over a local, system-provided Chrome, used by the
# `deck_browser` / `reactive_browser` test binaries.
# `default-features = false` drops the
# `bytes` screenshot API we don't use and, crucially, the `fetcher`/`native-tls`/
# `rustls` browser-download stack — this tool stays offline and never fetches a
# browser (reqwest is pulled with no TLS backend, for the loopback CDP handshake
# only). Gated twice over: `optional` keeps it out of a default build entirely (see
# `[features]`), and at runtime no system Chrome → "skipped", never a hard failure.
# Uses tokio (the workspace runtime); `futures` drives its CDP Handler.
chromiumoxide = { version = "0.9", default-features = false, optional = true }
futures = "0.3"
