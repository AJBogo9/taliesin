# qmd-fast marketing site — a website project, built by qmd-fast itself.
# Native flat schema (HTML-only; no `project:`/`format:` nesting). The docs book is
# a separate project; `mounts:` serves it under /docs in `preview` (the static
# `build` wires it with `build docs --out _site/docs`).
title: "qmd-fast"
description: "A fast, single-purpose dev server that turns one .qmd file into a live blog post, slide deck, book, or website — with executable code and an edit loop that updates the instant you save."
url: "https://qmd-fast.dev"
favicon: favicon.svg
toc: false

# Serve the sibling docs book under /docs so the "Docs" nav link resolves live.
mounts:
  docs: ../docs

nav:
  left:
    - { text: "Features", href: features.qmd }
    - { text: "Document types", href: formats.qmd }
    - { text: "Docs", href: "docs/" }
  right:
    - { icon: github, href: "https://github.com/AJBogo9/qmd-fast" }

footer:
  left:
    - { text: "Built with qmd-fast" }
  right:
    - { text: "Docs", href: "docs/" }
    - { icon: github, href: "https://github.com/AJBogo9/qmd-fast" }
