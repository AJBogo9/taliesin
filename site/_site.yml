# Taliesin marketing site: a website project, built by Taliesin itself.
# Native flat schema (HTML-only; no `project:`/`format:` nesting). The docs are two
# separate book projects; `mounts:` serves them under /docs/guide and /docs/internals
# in `preview`, and `build` writes each into `<out>/docs/guide` etc. of its own accord.
title: "Taliesin"
description: "A fast, single-purpose dev server that turns one .tmd file into a live blog post, book, or website, with executable code and an edit loop that updates the instant you save."
url: "https://taliesin.sh"
favicon: favicon.svg

# Serve the two sibling docs books + the gallery exhibits so the nav links resolve, live
# in `preview` and on disk after `taliesin build site` (one command builds all seven).
mounts:
  docs/guide: ../docs/guide
  docs/internals: ../docs/internals
  gallery/course: ../corpus/course
  gallery/tarn: ../corpus/tarn
  gallery/descent: ../corpus/descent
  gallery/analyst: ../corpus/analyst

nav:
  left:
    - { text: "Features", href: features.tmd }
    - { text: "Document types", href: formats.tmd }
    - { text: "See it live", href: showcase.tmd }
    - { text: "Gallery", href: gallery.tmd }
    - { text: "Guide", href: "docs/guide/" }
    - { text: "Internals", href: "docs/internals/" }
  right:
    - { icon: github, href: "https://github.com/AJBogo9/taliesin" }

footer:
  left:
    - { text: "Built with Taliesin" }
  right:
    - { text: "Guide", href: "docs/guide/" }
    - { text: "Internals", href: "docs/internals/" }
    - { icon: github, href: "https://github.com/AJBogo9/taliesin" }
