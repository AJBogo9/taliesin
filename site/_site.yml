# Taliesin marketing site: a website project, built by Taliesin itself.
# Native flat schema (HTML-only; no `project:`/`format:` nesting).
#
# This project is published ALONE, to its own Cloudflare Pages project (tools/publish.sh).
# The Guide, the Internals book and the Gallery are separate Taliesin projects with their
# own domains, and the links below are absolute URLs into them: outbound links, exactly
# like the GitHub one, not a composed tree. Nothing assembles several projects into this
# output, and every link on every page of this site resolves in `preview site` exactly as
# it does in the deploy.
title: "Taliesin"
description: "A fast, single-purpose dev server that turns one .tmd file into a live blog post, book, or website, with executable code and an edit loop that updates the instant you save."
url: "https://taliesin.sh"
favicon: favicon.svg

