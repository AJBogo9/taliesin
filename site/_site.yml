# Taliesin marketing site: a website project, built by Taliesin itself.
# Native flat schema (HTML-only; no `project:`/`format:` nesting). The docs books and the
# gallery exhibits are separate projects, composed into one deploy by tools/build-site.sh
# (which `.githooks/pre-push` runs, and which resolves every link below against the
# composed output). In `preview` this project serves its own pages only.
title: "Taliesin"
description: "A fast, single-purpose dev server that turns one .tmd file into a live blog post, book, or website, with executable code and an edit loop that updates the instant you save."
url: "https://taliesin.sh"
favicon: favicon.svg

# The prefixes tools/build-site.sh writes OTHER projects under. This project links into
# them (the navbar, the gallery cards, every call-to-action) but does not contain them, so
# `build site --check-only` would otherwise report 11 broken links that all resolve in the
# real deploy. The script still verifies every one of them against the composed output.
external-prefixes:
  - docs/guide
  - docs/internals
  - gallery

nav:
  left:
    - { text: "Features", href: features.tmd }
    - { text: "Document types", href: formats.tmd }
    - { text: "See it live", href: showcase.tmd }
    - { text: "Gallery", href: gallery.tmd }
    - { text: "Guide", href: "docs/guide/" }
    - { text: "Internals", href: "docs/internals/" }
  right:
    - { icon: github, href: "https://github.com/AJBogo9/taliesin" }

footer:
  left:
    - { text: "Built with Taliesin" }
  right:
    - { text: "Guide", href: "docs/guide/" }
    - { text: "Internals", href: "docs/internals/" }
    - { icon: github, href: "https://github.com/AJBogo9/taliesin" }
