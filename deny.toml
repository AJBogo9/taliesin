# cargo-deny configuration. Run `cargo deny check` on any dependency change — the
# pre-push hook does not cover it, and the restored workflow stays inert while this
# repo is private. `./tools/gates.sh` runs it alongside cargo-audit and every other gate.
# Keeps the dependency tree to redistribution-friendly licenses and flags advisories,
# mirroring the licenses we actually ship (MIT/Apache/ISC/BSD/…).
[advisories]
version = 2
# Also gate on `unsound` informational advisories for the whole tree (not just
# workspace crates); each accepted one is pinned by ID in `ignore` below with a
# rationale. `unmaintained` is already checked by the version-2 default.
unsound = "all"
# A few transitive deps are flagged *unmaintained* (not a security vulnerability, and no
# safe upgrade exists). `cargo audit`, run by hand alongside this file, already tolerates
# these as warnings;
# ignoring them here keeps cargo-deny's stricter gate meaningful, a NEW advisory (or any
# *vulnerability*) still fails the build.
ignore = [
    # Rides in through `syntect` (server-side syntax highlighting), which is a direct
    # workspace dependency, so we can't drop it without replacing the highlighter. The note
    # read "via comrak" until 2026-08-17; comrak had its own copy of syntect through its
    # default features, and turning those off left syntect where it always was.
    #
    # RUSTSEC-2024-0320 (yaml-rust 0.4.5 unmaintained) sat here too until 2026-08-26, when
    # naming syntect's features one by one dropped `yaml-load` — the only thing that pulled
    # yaml-rust in. Nothing here loads a `.sublime-syntax` at runtime. cargo-deny reports an
    # ignore that matches no crate, which is what caught it.
    "RUSTSEC-2025-0141", # bincode 1.x unmaintained (via syntect); no upgrade available
    # Rides in through `zeromq` (warm Jupyter kernel transport, crates/server/src/kernel.rs).
    # The double-free is in scc's panicking-comparator path; our map keys are non-panicking
    # `Vec<u8>` identities and the peers are loopback-only, self-spawned kernels, so that path
    # is unreachable. No fixed `scc` is published yet; revisit when one is.
    "RUSTSEC-2026-0205", # scc 3.7.3 double-free (zeromq→scc); panicking-comparator path unreachable
]

[licenses]
version = 2
allow = [
    "MIT",
    "MITNFA",        # MIT + no-false-attributions (fmt2io, via comrak) — permissive, MIT-equivalent
    "Apache-2.0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "Unlicense",     # public-domain dedication (win_uds, a Windows-only transitive dep) — permissive
]
confidence-threshold = 0.9

# Taliesin's OWN crates are AGPL-3.0 (see the root LICENSE). The global `allow` list
# above stays permissive-only ON PURPOSE: every *dependency* must be MIT/Apache/BSD/… so
# the whole work can still be dual-licensed (a hosted service / a proprietary commercial
# license). A single AGPL/GPL dependency would force the combined work to AGPL and remove
# that option, so an AGPL dep must still fail review — only our own crates are exempted here.
[[licenses.exceptions]]
crate = "taliesin-core"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
crate = "taliesin-server"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
crate = "live-edit-bench"
allow = ["AGPL-3.0-only"]

# `option-ext` (pulled in transitively by `dirs`, which `jupyter-zmq-client` uses) is
# MPL-2.0 — weak, *file-level* copyleft: using it as an unmodified dependency imposes no
# license obligation on Taliesin's own code. Confined to a per-crate exception rather than
# allowing MPL-2.0 globally, so the project's license policy stays permissive-only and a
# NEW MPL-2.0 dependency would still be flagged for review.
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
