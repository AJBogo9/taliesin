<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="480" height="260" fill="#ffffff"/>
  <!-- axes -->
  <line x1="56" y1="20" x2="56" y2="212" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="56" y1="212" x2="452" y2="212" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- y label -->
  <text x="16" y="120" fill="#475569" font-size="12" transform="rotate(-90 16 120)" text-anchor="middle">variance explained</text>
  <!-- x label -->
  <text x="254" y="244" fill="#475569" font-size="12" text-anchor="middle">principal component</text>
  <!-- bars: a scree curve -->
  <g fill="#4c8dff">
    <rect x="76"  y="44"  width="40" height="168"/>
    <rect x="132" y="108" width="40" height="104"/>
    <rect x="188" y="150" width="40" height="62"/>
    <rect x="244" y="178" width="40" height="34"/>
    <rect x="300" y="192" width="40" height="20"/>
    <rect x="356" y="200" width="40" height="12"/>
    <rect x="412" y="205" width="28" height="7"/>
  </g>
  <!-- elbow marker -->
  <polyline points="96,44 152,108 208,150 264,178 320,192 376,200 426,205"
            fill="none" stroke="#e0566b" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="208" cy="150" r="5" fill="#e0566b"/>
  <text x="216" y="142" fill="#e0566b" font-size="12">elbow</text>
  <!-- x ticks -->
  <g fill="#94a3b8" font-size="11" text-anchor="middle">
    <text x="96"  y="228">1</text>
    <text x="152" y="228">2</text>
    <text x="208" y="228">3</text>
    <text x="264" y="228">4</text>
    <text x="320" y="228">5</text>
    <text x="376" y="228">6</text>
    <text x="426" y="228">7</text>
  </g>
</svg>
