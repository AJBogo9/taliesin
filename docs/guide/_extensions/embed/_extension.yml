name: Embed
description: "Responsive media embeds via shortcodes."
css: embed.css
shortcodes:
  youtube: '<div class="qmd-embed"><iframe src="https://www.youtube-nocookie.com/embed/{{1}}" title="YouTube video" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>'
  vimeo: '<div class="qmd-embed"><iframe src="https://player.vimeo.com/video/{{1}}" title="Vimeo video" loading="lazy" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>'
