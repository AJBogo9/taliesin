title: "Taliesin User Guide"
author: "Andreas Bogossian"
# Its own deploy, its own domain. The Guide, the Internals book and the marketing site are
# three separate Taliesin projects published to three separate Cloudflare Pages projects
# (tools/publish.sh); nothing composes them into one tree, so each needs its own `url:`
# for canonical links, sitemap.xml and robots.txt.
url: "https://guide.taliesin.sh"

# The Guide and the Internals book are separate deploys on separate domains, so a reader
# who lands on a chapter from a search engine has no route to any other Taliesin property
# unless the chrome gives them one. The links are absolute for the same reason every
# cross-site link in this repo is (`crates/core/tests/cross_site_links.rs` resolves them).
footer:
  left:
    - { text: "Built with Taliesin" }
  right:
    - { text: "Taliesin", href: "https://taliesin.sh/" }
    - { text: "Internals", href: "https://internals.taliesin.sh/" }
    - { text: "Gallery", href: "https://gallery.taliesin.sh/" }
    - { icon: github, href: "https://github.com/AJBogo9/taliesin" }

chapters:
  - index.tmd
  - part: "Using Taliesin"
    chapters:
      - using/getting-started.tmd
      - using/choosing.tmd
      - using/preview.tmd
      - using/code.tmd
      - using/writing.tmd
      - using/interactive.tmd
      - using/theming.tmd
      - using/recipes.tmd
  - part: "Reference"
    chapters:
      - reference/cheatsheet.tmd
      - reference/frontmatter.tmd
      - reference/cell-options.tmd
      - reference/cli.tmd
      - reference/troubleshooting.tmd
      - reference/accessibility.tmd
      - reference/licensing.tmd
