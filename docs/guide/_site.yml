title: "Taliesin User Guide"
author: "Andreas Bogossian"
# Its own deploy, its own domain. The Guide, the Internals book and the marketing site are
# three separate Taliesin projects published to three separate Cloudflare Pages projects
# (tools/publish.sh); nothing composes them into one tree, so each needs its own `url:`
# for canonical links, sitemap.xml and robots.txt.
url: "https://guide.taliesin.sh"

chapters:
  - index.tmd
  - part: "Using Taliesin"
    chapters:
      - using/getting-started.tmd
      - using/choosing.tmd
      - using/preview.tmd
      - using/code.tmd
      - using/writing.tmd
      - using/interactive.tmd
      - using/theming.tmd
      - using/recipes.tmd
  - part: "Reference"
    chapters:
      - reference/cheatsheet.tmd
      - reference/frontmatter.tmd
      - reference/cell-options.tmd
      - reference/cli.tmd
      - reference/troubleshooting.tmd
      - reference/accessibility.tmd
      - reference/licensing.tmd
