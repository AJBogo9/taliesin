name: CI

# Minimal solo-dev backstop: this private repo's value from CI is the fresh-clone
# build (a warm local `cargo test` can stay green while the committed tree is
# broken). So run only on what actually lands — pushes to `main` and PRs — not on
# every WIP branch push, and cache the cargo build to keep each run to ~1-2 min.
on:
  push:
    branches: [main]
  pull_request:
  # Weekly RustSec advisory scan even with no commits, so a newly-disclosed CVE
  # in a (possibly transitive) dependency surfaces on its own.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The hand-rolled JS minifier's equivalence guard shells out to Node to compare
      # acorn token streams (Node's OWN bundled acorn — no network, no dependency).
      # `node --check` cannot see that bug class: a nested-template or regex-context slip
      # rewrites a token's VALUE with the count unchanged, so the output parses clean and
      # is silently wrong. TALIESIN_REQUIRE_NODE=1 makes a missing Node a HARD FAIL rather
      # than a skip, mirroring TALIESIN_REQUIRE_KERNEL below, so this can never quietly
      # regress to zero coverage.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The corpus is the spec: these gates encode the project's contract.
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Test
        env:
          TALIESIN_REQUIRE_NODE: "1"
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Exercise the live execution stack (kernel.rs / exec.rs) against a REAL ipykernel —
  # the `test` job above cannot, because TALIESIN_PYTHON is unset there so every kernel
  # test skips, leaving the most behavior-rich subsystem unverified. TALIESIN_REQUIRE_KERNEL=1
  # turns the canary test into a HARD FAIL if the interpreter ever goes missing, so the exec
  # stack can never silently re-skip back to zero coverage.
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # numpy is one of the warm-pool's forkserver preload candidates (`numpy`,
      # `matplotlib`, `torch`, each preloaded only if importable); the pool test asserts a
      # forked kernel inherits the preloaded `numpy` via copy-on-write, so it must be present.
      # matplotlib is required by the fig-export concurrency test
      # (`concurrent_pages_with_same_relative_export_do_not_clobber`), which exercises the
      # inline-Figure export hook; without it the cell errors and no PDF is written.
      - name: Install ipykernel + numpy + matplotlib
        run: python -m pip install --upgrade pip ipykernel numpy matplotlib
      - name: Test with a live kernel
        env:
          TALIESIN_PYTHON: python
          TALIESIN_REQUIRE_KERNEL: "1"
          # `cell_timeout()` caches TALIESIN_CELL_TIMEOUT on its first read (process-global
          # OnceLock). The runaway-interrupt test needs a short cap, but under parallel test
          # execution another kernel test can read the default (120s) first, so the runaway
          # cell then runs the full 120s and the test fails. Pinning the cap job-wide makes
          # the first read deterministic; every other kernel cell here finishes in well under 3s.
          TALIESIN_CELL_TIMEOUT: "3"
        run: cargo test -p taliesin-server

  # The R twin of the `kernel` job above. `{r}` cells and TALIESIN_R are advertised as
  # first-class in the README, but nothing exercised the R path: no setup-r, no
  # TALIESIN_R-gated test, no assertion on KernelSpec::r()'s argv — while Python had a
  # canary built specifically so its coverage could never silently reach zero. The guard
  # existed for the language we look at. TALIESIN_REQUIRE_R=1 makes a missing R a HARD
  # FAIL rather than a skip, for the same reason.
  kernel-r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      # The package alone is what matters: Taliesin launches the kernel directly, so
      # `IRkernel::installspec()` is a no-op here (a documented drift the 07-07 audit
      # already caught in the User Guide) and would additionally need Jupyter present.
      - name: Install IRkernel
        run: Rscript -e 'install.packages("IRkernel", repos = "https://cloud.r-project.org")'
      - name: Test with a live R kernel
        env:
          TALIESIN_R: R
          TALIESIN_REQUIRE_R: "1"
        run: cargo test -p taliesin-server --test r_kernel

  # Type-check the preview client JS (client.js + the sibling shipped scripts:
  # search.js, toc-spy.js, toc-sheet.js). They carry `// @ts-check` and have silently
  # regressed to tsc errors before a release; this gate keeps them honest.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Type-check the client JS
        run: cd web-client && npx -y -p typescript tsc -p jsconfig.json
      # The bundled browser scripts (the code-enhance/ fragments, deck.js, qmd-js.js,
      # mermaid/scrolly/tabset/walkthrough) ship to every page and had no type gate;
      # this keeps them at strict-zero the same way the client JS is kept honest.
      - name: Type-check the bundled assets JS
        run: cd crates/core/assets/js && npx -y -p typescript tsc -p jsconfig.json
      # The publish passcode gate (functions/_middleware.js) is security-critical and its
      # only functional test is this dependency-free node:test file. Run it here (Node is
      # already set up) so an auth-logic regression (e.g. a broken fail-closed default)
      # can never ship green.
      - name: Test the publish passcode gate
        run: node --test crates/server/src/assets/_middleware.test.mjs

  # The VS Code companion: build the extension, type-check its TS, and run the OFFLINE
  # TextMate grammar tokenization gate (loads the .tmd grammar + the bundled MIT
  # markdown/python/yaml base grammars from a downloaded VS Code build — no Extension Host
  # launch, no display needed). Keeps the .tmd editor syntax highlighting from silently
  # rotting. The heavier @vscode/test-electron e2e (real Extension Host) stays a local/F5 check.
  editor-vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci
      - name: Build + type-check
        run: |
          npm run build
          npx tsc -p . --noEmit
      - name: Fetch base grammars for the offline grammar test
        run: node scripts/ensure-vscode.cjs
      - name: Grammar + unit tests
        run: npm test

  # Dependency advisory scan, kept off the fmt+test hot path. `serde_yaml` is
  # deprecated but currently advisory-free; this is the backstop that tells us if
  # that (or any transitive dep) ever grows a CVE — at which point we migrate.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  # Dependency *policy* gate (`deny.toml`): redistribution-friendly licenses only, no
  # unknown registries/git sources, and a stricter advisory pass than `audit` above (so a
  # new dep with a disallowed license or a banned source fails the build, not just a CVE).
  # Verified locally against the current tree — advisories/licenses/bans/sources all ok.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check
