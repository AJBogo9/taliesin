name: CI

# The value CI adds over the local gates is the FRESH-CLONE build (a warm local
# `cargo test` can stay green while the committed tree is broken) and the outside
# contributor's PR, which runs no local gate at all: `core.hooksPath` is unset in a
# fresh clone, so `.githooks/pre-push` does not exist for anyone but the author.
# So run on what actually lands — pushes to `main` and PRs — not on every WIP branch
# push, and cache the cargo build to keep each run to ~1-2 min.
#
# The local equivalent is `./tools/gates.sh`, which runs this same set in one process
# and refuses to be green unless every gate ran. The two must not drift: a gate added
# here belongs there, and vice versa.
#
# Every job runs unconditionally on the triggers below. The repository is public, and
# `crates/core/tests/stale_docs.rs` fails if a job is made conditional on its visibility
# again, because the docs say CI checks every push to `main` and every pull request.
on:
  push:
    branches: [main]
  pull_request:
  # A manual run on a chosen branch.
  workflow_dispatch:
  # Weekly RustSec advisory scan even with no commits, so a newly-disclosed CVE
  # in a (possibly transitive) dependency surfaces on its own.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # `crates/core/tests/reactive_live_region.rs` slices `markLiveIfTextual` out of the
      # SHIPPED bundle and runs it in Node against stand-in containers, so the rule that
      # decides which `//| input:` sinks announce themselves is pinned against the code
      # that actually ships. TALIESIN_REQUIRE_NODE=1 makes a missing Node a HARD FAIL
      # rather than a skip, mirroring TALIESIN_REQUIRE_KERNEL below, so this can never
      # quietly regress to zero coverage.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The corpus is the spec: these gates encode the project's contract.
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Test
        env:
          TALIESIN_REQUIRE_NODE: "1"
        # No feature flag: the headless-Chrome test driver and the `headless-js` feature
        # that guarded it were both cut on 2026-08-08, so the default-feature build is now
        # the whole workspace and there is nothing left for a browser gate to arm.
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The two gates the parity promise at the top of this file was missing. Both are
      # STEPS on this job, not new jobs: they reuse the debug build `cargo test` just
      # produced, so they cost a link rather than a second workspace build.
      # `--check-only` renders in memory and writes nothing; `--no-exec` is what keeps
      # both kernel-free. `.githooks/pre-push` runs the same two, as its steps 4 and 5.
      # Both books: wave 9 wired the guide and covered one of two already-separate books.
      - name: Document gate (the manual is a shipped document)
        run: |
          cargo run -q -p taliesin-server -- build docs/guide --check-only --no-exec
          cargo run -q -p taliesin-server -- build docs/internals --check-only --no-exec
      - name: Publish gate (all four sites build; gallery exhibit links resolve)
        run: ./tools/publish.sh --check

  # Exercise the live execution stack (kernel.rs / exec.rs) against a REAL ipykernel —
  # the `test` job above cannot, because TALIESIN_PYTHON is unset there so every kernel
  # test skips, leaving the most behavior-rich subsystem unverified. TALIESIN_REQUIRE_KERNEL=1
  # turns the canary test into a HARD FAIL if the interpreter ever goes missing, so the exec
  # stack can never silently re-skip back to zero coverage.
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # numpy is required by `crates/server/tests/figure_theme_recolour.rs`, which drives
      # the shipped `_tali_recolour` preamble through a REAL kernel against a numpy-backed
      # heatmap and reads the recoloured annotation back; without it the cell errors.
      # matplotlib is required by the fig-export concurrency test
      # (`concurrent_pages_with_same_relative_export_do_not_clobber`), which exercises the
      # inline-Figure export hook; without it the cell errors and no PDF is written.
      - name: Install ipykernel + numpy + matplotlib
        run: python -m pip install --upgrade pip ipykernel numpy matplotlib
      - name: Test with a live kernel
        env:
          TALIESIN_PYTHON: python
          TALIESIN_REQUIRE_KERNEL: "1"
          # `cell_timeout()` memoizes TALIESIN_CELL_TIMEOUT on first read (process-global
          # OnceLock), so this value governs every kernel test that does not set its own
          # `cell_cap` on the Kernel, which is most of them. The floor is
          # `a_first_build_publishes_the_body_before_the_cells_finish`
          # (crates/server/src/serve_site/mod.rs), whose cell sleeps 8s on purpose, to prove
          # the early publish beats the cell rather than racing it, so the cap has to clear
          # 8s with margin for a slow shared runner. The runaway-interrupt tests are NOT
          # governed by this value, for two different reasons: the four in kernel.rs set
          # `cell_cap`/`silence_cap` directly on the Kernel, bypassing the OnceLock (see its
          # own comment on kernel_executes_state_errors_and_interrupts_runaway_cell); the one
          # in exec.rs (an_interrupt_from_outside_the_run_loop_stops_the_running_cell) drives
          # a bare Executor and ends its sleep with a manual interrupt_pid() call within tens
          # of ms of a marker file appearing, long before any wall-clock cap could matter.
          TALIESIN_CELL_TIMEOUT: "30"
        run: cargo test -p taliesin-server

  # Type-check the preview client JS (client.js + the sibling shipped scripts:
  # search.js, toc-spy.js). They carry `// @ts-check` and have silently
  # regressed to tsc errors before a release; this gate keeps them honest.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Type-check the client JS
        run: cd web-client && npx -y -p typescript tsc -p jsconfig.json
      # The bundled browser scripts (the code-enhance/ fragments, tali-js.js, mermaid.js)
      # ship to every page and had no type gate; this keeps them at strict-zero the same
      # way the client JS is kept honest. The set is GLOBBED, not listed: the config at
      # `crates/core/assets/js/jsconfig.json` takes every `.js` here and under
      # `code-enhance/` and excludes the minified vendored ones, and its own note records
      # that a hand-written list rotted before.
      - name: Type-check the bundled assets JS
        run: cd crates/core/assets/js && npx -y -p typescript tsc -p jsconfig.json

  # The VS Code companion: build the extension, type-check its TS, and run the OFFLINE
  # TextMate grammar tokenization gate (loads the .tmd grammar + the bundled MIT
  # markdown/python/yaml base grammars from a downloaded VS Code build — no Extension Host
  # launch, no display needed). Keeps the .tmd editor syntax highlighting from silently
  # rotting. A heavier @vscode/test-electron e2e existed here as a local/F5 check until
  # 2026-08-09, when it went for running under no script, hook or workflow.
  editor-vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci
      - name: Build + type-check
        run: |
          npm run build
          npx tsc -p . --noEmit
      - name: Fetch base grammars for the offline grammar test
        run: node scripts/ensure-vscode.cjs
      - name: Grammar + unit tests
        run: npm test

  # Dependency advisory scan, kept off the fmt+test hot path. `serde_yaml` is
  # deprecated but currently advisory-free; this is the backstop that tells us if
  # that (or any transitive dep) ever grows a CVE — at which point we migrate.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  # Dependency *policy* gate (`deny.toml`): redistribution-friendly licenses only, no
  # unknown registries/git sources, and a stricter advisory pass than `audit` above (so a
  # new dep with a disallowed license or a banned source fails the build, not just a CVE).
  # Verified locally against the current tree — advisories/licenses/bans/sources all ok.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check
