name: CI

# Minimal solo-dev backstop: this private repo's value from CI is the fresh-clone
# build (a warm local `cargo test` can stay green while the committed tree is
# broken). So run only on what actually lands — pushes to `main` and PRs — not on
# every WIP branch push, and cache the cargo build to keep each run to ~1-2 min.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      # The corpus is the spec: these two gates encode the project's contract.
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace
      # Enable once the tree is clippy-warning-clean:
      # - run: rustup component add clippy && cargo clippy --all-targets -- -D warnings
