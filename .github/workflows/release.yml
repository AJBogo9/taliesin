name: Release

# Attach a prebuilt binary to every `v*` tag, because the alternative is what shipped
# before: every verifiable claim about this tool sat behind a 257-crate release build, and
# launch attention is one-shot.
#
# The platform matrix here is the ONE source of truth for it. `README.md` repeats it for
# humans and `crates/core/tests/stale_docs.rs` asserts the two agree, so adding a target
# without documenting it (or promising one this never builds) fails the suite. That same
# test resolves every path either workflow names, because nothing else does: no job here
# runs while the repo is private, so a dead path is invisible until the launch commit.
#
# Guarded on repository visibility for the same reason as ci.yml: this file has to be
# committed before publication so the published history carries it, and until then it must
# not bill Actions minutes on a private repo.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the (draft-free) release once, so the matrix jobs below only upload. Doing it
  # inside the matrix would race three jobs against one `gh release create`.
  create:
    if: github.event.repository.private != true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "$TAG" --generate-notes

  build:
    needs: create
    if: github.event.repository.private != true || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          # `-musl`, not `-gnu`: a gnu build inherits the runner image's glibc as a FLOOR,
          # and `ubuntu-latest` silently became 24.04, so the v1.0.0 Linux asset requires
          # GLIBC_2.39 and dies with `version 'GLIBC_2.39' not found` on Ubuntu 22.04,
          # Debian 12, RHEL 9 and Amazon Linux 2023 before printing anything. Nobody could
          # see it: the only machine that has ever run a released binary is the author's,
          # which is the one distro new enough to load it. musl links statically, so there
          # is no floor left to drift. Same failure genus as the `macos-13` retirement
          # below, and the same fix: name the thing, do not inherit it.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          # `macos-15-intel`, not `macos-13`: GitHub retired the macos-13 image (it keeps
          # only the latest two macOS versions), so this row named a runner label that no
          # longer resolves — on a workflow no tag has ever fired, so nothing could have
          # caught it. Intel macOS is still a standard runner, free for public repos, under
          # the `-intel` labels. Checked against actions/runner-images on 2026-08-10.
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # NO `--features taliesin-server/headless-js`, deliberately. It used to be here so a
      # DOWNLOADED binary would be the complete tool, but as of 2026-08-08 no shipped code
      # path calls the browser driver at all: `read --run-js` went in Wave 2 and `pdf` in
      # Wave 4, leaving only the `deck_browser` / `reactive_browser` TEST binaries, which a
      # release never builds. Turning it on here would cost 24% of every cross-build for a
      # dependency the binary cannot reach. Nowhere else passes it either: the feature
      # itself no longer exists in any `Cargo.toml`.
      # musl needs a C toolchain, which the other two targets do not: `katex` pulls
      # `quick-js` -> `libquickjs-sys`, which compiles the QuickJS engine with cc-rs, and
      # it is the only C in the tree. cc-rs looks for `x86_64-linux-musl-gcc` first, a name
      # `musl-tools` does not install, so `CC_…` below names the one it does. Verified by
      # building this recipe in a `rust:latest` container: static-pie, no glibc references,
      # and a math-heavy corpus page renders byte-identically to the gnu build, which is
      # what proves QuickJS itself works under musl and not merely that it compiled.
      - name: musl C toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }} -p taliesin-server
      # The tarball carries the licence and the third-party notices next to the binary:
      # Taliesin is AGPL-3.0 and vendors third-party assets, so a bare binary would be a
      # distribution without the terms it is distributed under.
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          stage="taliesin-$TAG-$TARGET"
          mkdir "$stage"
          cp "target/$TARGET/release/taliesin" "$stage/"
          cp LICENSE LICENSE-OUTPUT-EXCEPTION.md THIRD_PARTY.md README.md "$stage/"
          # The binary embeds d3, Observable Plot and Mermaid via `include_str!` and KaTeX's
          # CSS via `build.rs`. MIT and ISC both require the PERMISSION NOTICE — not just the
          # copyright line — to accompany a copy, and THIRD_PARTY.md carries copyright lines
          # and URLs only, which that file's own standard says is not a notice. So the
          # verbatim texts travel too, at their repository paths, so THIRD_PARTY.md's own
          # relative links resolve inside the tarball. NOT `cp --parents`: the matrix builds
          # on macos-latest and macos-15-intel, whose BSD `cp` has no such flag.
          # `crates/core/tests/third_party.rs` asserts this list against the tree.
          for f in crates/core/assets/js/LICENSES.md \
                   crates/core/assets/katex/LICENSE \
                   crates/core/assets/fonts/literata-OFL-fontsource.txt \
                   crates/core/assets/fonts/jetbrains-mono-OFL-fontsource.txt; do
            mkdir -p "$stage/$(dirname "$f")"
            cp "$f" "$stage/$f"
          done
          tar czf "$stage.tar.gz" "$stage"
          shasum -a 256 "$stage.tar.gz" > "$stage.tar.gz.sha256"
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          gh release upload "$TAG" \
            "taliesin-$TAG-$TARGET.tar.gz" \
            "taliesin-$TAG-$TARGET.tar.gz.sha256" \
            --clobber
