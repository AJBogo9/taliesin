[workspace]
resolver = "3"
members = ["crates/core", "crates/server", "tools/live-edit-bench"]

[workspace.package]
# 1.0.0: the scope is closed. The 2026-08 reduction campaign finished at Phase 4, the
# feature set is final for the tool's one use case, and the first public tag says so.
# Post-1.0 the promise is ordinary semver: a breaking change needs a 2.0.
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["Andreas Bogossian <andreas.bogossian9@gmail.com>"]
repository = "https://github.com/AJBogo9/taliesin"

[workspace.dependencies]
# Internal crates
taliesin-core = { path = "crates/core" }

# Shared external dependencies are declared here as the project grows
# (e.g. comrak in Phase 1, axum/tokio/notify in Phase 2) so versions stay
# centralized across the workspace.

# Typed parse of the multi-page project config (`_site.yml`). serde_yaml is
# archived upstream but stable and dependency-light; the `serde_yml` fork is the
# fallback if it ever breaks. YAML stays the config format.
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

# Server-side syntax highlighting at render time, on syntect's pure-Rust fancy-regex
# backend. That selection was defeated until 2026-08-17: comrak was taken with its
# DEFAULT features, which pull syntect with its own defaults, so oniguruma (C) was in
# the tree and, through Cargo feature unification, was the backend actually compiled
# in — plus `clap`, `bon` and `emojis` for a CLI this crate never calls. Core uses
# `comrak::nodes` and `parse_document` only, so `default-features = false` (see
# `crates/core/Cargo.toml`) drops all four. A C build dependency is the same class this
# manifest already refuses elsewhere for breaking `cargo install`; this one was kept by
# accident rather than by decision. We emit scope *classes* and color them in CSS,
# so the light/dark toggle restyles code without re-highlighting.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

# Syntax definitions syntect's bundled set is missing: notably TypeScript and
# TOML, both of which the docs use. Curated by the `bat` project; `syntect-fancy`
# matches our fancy-regex feature selection (it adds no onig of its own). Definitions only, no logic.
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }

# Non-poisoning Mutex for the dev server's shared state: a panic while a lock is
# held releases it cleanly instead of poisoning it (which would otherwise make
# every later request panic). Lighter + faster than std's poison-tracking lock.
parking_lot = "0.12"

# Just `kill(2)`: send SIGINT to a runaway kernel process to interrupt the cell
# (the `interrupt_mode: signal` path) without killing the warm kernel. Already in
# the tree transitively (via tokio), so this is a near-free direct dependency.
libc = "0.2"

# Image optimization (item 169). Core uses ONLY `image_dimensions`, a header read, to emit
# intrinsic `width`/`height`; the server adds the `avif` + `rayon` features to transcode.
# The decoder set is exactly what the corpus contains — `.svg` has no intrinsic pixel size
# and is not handled here, and `.avif` *decoding* is deliberately absent because it means
# dav1d (C) via `avif-native`.
#
# NEVER depend on `ravif` directly. That turns on rav1e's `asm` feature, whose build script
# fails with "NASM build failed. Make sure you have nasm installed" — measured — which would
# break `cargo install` and the macOS cross-builds in `release.yml`. Going through `image`'s
# own `avif` feature configures rav1e without asm; a cold release build of it is 21.8 s at
# `-j4` on a machine with no nasm at all.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
] }

# The shipped binary carries no DWARF. There was no `[profile.release]` at all until
# 2026-08-17, so every download included full debug info. Measured that day, same
# machine, same commit: 31.0 MB as it shipped, 28.8 MB with the debug info dropped,
# 24.9 MB with the symbol table dropped too. Dated and ungated by the convention in
# CLAUDE.md: it measures the machine, so it is re-measured rather than asserted.
#
# `"debuginfo"` and not `true`, deliberately, at a cost of 3.9 MB. `true` also drops the
# symbol table, which is what turns a user's `RUST_BACKTRACE=1` report from named frames
# into hex addresses. One maintainer, pre-1.0, about to be public: an actionable bug
# report is worth more than the megabytes.
#
# `lto` is deliberately NOT set. It is a link-time cost on every release build for a
# size/speed win nothing here has measured, and the load-bearing performance numbers
# (`tools/live-edit-bench`) are warm-server work that link-time inlining does not touch.
[profile.release]
strip = "debuginfo"
