<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="A Plain Deck">
  <style>
    /* The deck stage is dark by default, so the mark is light and the light scheme
       inverts it. An SVG loaded through an img element cannot inherit `currentColor`,
       which is why the file carries both schemes itself. NOTE: an SVG style element is
       XML, not HTML -- it is NOT an implicit CDATA section, so a bare angle bracket or
       ampersand anywhere in here (comments included) makes the whole file un-parseable
       and the browser renders a broken image. Spell comparisons out in words. */
    .frame { stroke: #ffffff; }
    .fill { fill: #ffffff; }
    @media (prefers-color-scheme: light) {
      .frame { stroke: #14161b; }
      .fill { fill: #14161b; }
    }
  </style>
  <!-- three offset slide frames, back to front: a deck seen edge-on -->
  <g class="frame" fill="none" stroke-width="2" stroke-linejoin="round">
    <rect x="3" y="7" width="26" height="18" rx="2" opacity="0.35"/>
    <rect x="7" y="11" width="26" height="18" rx="2" opacity="0.65"/>
    <rect x="11" y="15" width="26" height="18" rx="2"/>
  </g>
  <!-- the advance caret on the front slide -->
  <g class="fill">
    <path d="M20 21 L27 24 L20 27 Z"/>
  </g>
</svg>
