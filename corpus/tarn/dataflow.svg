<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 130" role="img" aria-label="A query plan: read_csv, filter and groupby build a lazy plan; collect runs it.">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="slategray"/>
    </marker>
  </defs>
  <!-- lazy stages -->
  <g font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">
    <rect x="12"  y="40" width="130" height="46" rx="8" fill="steelblue"/>
    <text x="77"  y="68" fill="white">read_csv</text>
    <rect x="182" y="40" width="130" height="46" rx="8" fill="steelblue"/>
    <text x="247" y="68" fill="white">filter</text>
    <rect x="352" y="40" width="130" height="46" rx="8" fill="steelblue"/>
    <text x="417" y="68" fill="white">groupby.sum</text>
    <rect x="522" y="40" width="126" height="46" rx="8" fill="seagreen"/>
    <text x="585" y="68" fill="white">collect</text>
    <!-- arrows -->
    <line x1="142" y1="63" x2="178" y2="63" stroke="slategray" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="312" y1="63" x2="348" y2="63" stroke="slategray" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="482" y1="63" x2="518" y2="63" stroke="slategray" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- captions -->
    <text x="247" y="24" fill="slategray" font-size="13">lazy plan, no work yet</text>
    <text x="585" y="24" fill="seagreen" font-size="13">runs here</text>
  </g>
</svg>
