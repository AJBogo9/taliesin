    <rect x="296" y="8" width="56" height="30" rx="4"/>
    <rect x="8" y="103" width="60" height="30" rx="4"/>
    <rect x="80" y="103" width="60" height="30" rx="4"/>
    <rect x="152" y="103" width="60" height="30" rx="4"/>
    <rect x="224" y="103" width="60" height="30" rx="4"/>
    <rect x="296" y="103" width="56" height="30" rx="4"/>
