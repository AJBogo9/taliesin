project:
  type: website
  output-dir: _site
  resources:
    - CNAME
    - robots.txt
    - instantpage.js
    - post-nav.js
    - llms.txt
    - llms-full.txt

website:
  title: "Andreas Bogossian"
  description: "Notes on challenging technical things"
  site-url: "https://andreasbogossian.com"
  favicon: bell-curve.svg
  search: false
  open-graph:
    image: og-image.webp
  page-footer:
    border: true
    background: "dark"
    foreground: "light"
    left:
      - text: "© 2026 Andreas Bogossian"
      - text: "Source"
        href: https://github.com/AJBogo9/tech-blog
