        href: /blog.xml
  navbar:
    left:
      - text: "Blog"
        href: blog.qmd
      - text: "Publications"
        href: publications.qmd
      - text: "Projects"
        href: projects.qmd
      - text: "CV"
        href: cv.qmd

jupyter: python3

format:
  html:
    theme: [darkly, theme.scss]
    css: custom.css
    highlight-style: github-dark
    code-fold: false
    code-tools: false
    toc: true
    toc-depth: 3
    toc-title: "Contents"
    number-sections: false
    smooth-scroll: true
    link-external-icon: true
    fig-responsive: true
    fig-lazy-loading: true
    html-math-method: plain
    lightbox: true
    include-in-header:
      text: |
        <link rel="preconnect" href="https://cdn.jsdelivr.net">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <script type="speculationrules">
        {"prerender":[{"where":{"href_matches":"/*"},"eagerness":"moderate"}]}
        </script>
    include-after-body:
      text: |
        <script src="/instantpage.js" type="module"></script>
        <script src="/post-nav.js" defer></script>

execute:
  freeze: auto
  echo: true
  warning: false