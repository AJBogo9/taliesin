<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 40" width="260" height="40" role="img" aria-label="Andreas Bogossian">
  <style>
    /* Dark mode (the default theme), matching bell-curve.svg's convention. An SVG loaded
       through an img element cannot inherit `currentColor`, so it carries its own
       two-scheme palette. NOTE: an SVG style element is XML, not HTML -- it is not an
       implicit CDATA section, so a bare angle bracket or ampersand in here (even inside a
       comment) makes the whole file un-parseable and the browser renders a broken image.
       Spell tag names out in words. */
    .mark { stroke: #ffffff; }
    .word { fill: #ffffff; }
    @media (prefers-color-scheme: light) {
      .mark { stroke: #000000; }
      .word { fill: #000000; }
    }
  </style>
  <!-- the bell-curve mark, the same glyph the favicon uses, scaled into the lockup -->
  <g class="mark" fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M4 32 Q 8,32 10,28 Q 12,20 14,13 Q 16,5 20,3 Q 24,5 26,13 Q 28,20 30,28 Q 32,32 36,32"/>
  </g>
  <text class="word" x="50" y="27" font-family="Georgia, serif" font-size="20" letter-spacing="-0.4">Andreas Bogossian</text>
</svg>
