<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" role="img" aria-labelledby="dt">
  <title id="dt">Three overlapping probability densities</title>
  <desc>A broad prior, a sharp likelihood, and a posterior peaked between them.</desc>
  <line x1="20" y1="140" x2="310" y2="140" stroke="gray" stroke-width="1"/>
  <line x1="20" y1="20" x2="20" y2="140" stroke="gray" stroke-width="1"/>
  <path d="M 30 140 C 54 140, 66 70, 90 70 C 114 70, 126 140, 150 140" fill="none" stroke="steelblue" stroke-width="2.5"/>
  <path d="M 110 140 C 130 140, 140 45, 160 45 C 180 45, 190 140, 210 140" fill="none" stroke="darkorange" stroke-width="2.5"/>
  <path d="M 175 140 C 199 140, 211 90, 235 90 C 261 90, 274 140, 300 140" fill="none" stroke="seagreen" stroke-width="2.5"/>
  <text x="90" y="158" font-size="11" text-anchor="middle" fill="steelblue">prior</text>
  <text x="160" y="158" font-size="11" text-anchor="middle" fill="darkorange">likelihood</text>
  <text x="235" y="158" font-size="11" text-anchor="middle" fill="seagreen">posterior</text>
</svg>
