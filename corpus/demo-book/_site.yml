title: "A Short Demo Book"
author: "Andreas Bogossian"
logo: logo.svg       # brand image in the book topbar AND the chapter drawer head
toc: true

chapters:            # presence makes this a book — no project: type: needed
  - index.tmd
  - intro.tmd
  - part: "Core"
    chapters:
      - file: methods.tmd   # `{ file:, text: }` overrides the sidebar label
        text: "Methodology"
      - results.tmd
  - file: summary.tmd       # a top-level chapter can use the override form too
    text: "Wrap-up"
  - appendix.tmd            # draft: true — shows in preview only (draft-aware pin)
